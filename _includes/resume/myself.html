{% assign myself = site.data.myself %}
<header class="myself" itemscope itemtype="https://schema.org/Person">
  <nav class="myself-nav no-print" aria-label="Profile links">
    <div class="myself-links">
      <a href="{{ site.resume_social_links.resume_github_url }}" target="_blank" rel="noopener">GitHub</a>
      <a href="{{ site.resume_social_links.resume_website_url }}" target="_blank" rel="noopener">Scholar</a>
      <a href="mailto:{{ site.resume_contact_email }}" data-analytics-event="email_click">Email</a>
    </div>
  </nav>

  <div class="myself-content">
    <h1 itemprop="name">{{ myself.name }}</h1>
    <p class="myself-role" itemprop="jobTitle">{{ myself.role }}</p>
    <p class="myself-affiliation" itemprop="affiliation">{{ myself.affiliation }}</p>
    <p class="myself-headline">{{ myself.headline }}</p>
    <p class="myself-summary" itemprop="description">{{ myself.summary }}</p>
    <p class="myself-focus">{{ myself.focus }}</p>
    <div class="myself-actions no-print">
      <a class="button button-primary" href="#current-work" data-analytics-event="current_work_click">Current Work</a>
      <a class="button button-secondary" href="#research-contributions" data-open-details="research-contributions" data-analytics-event="full_cv_click" aria-controls="research-contributions" aria-expanded="false">View full CV</a>
      <a class="button button-secondary" href="#about" data-open-details="about" aria-controls="about" aria-expanded="false">A Little More About Me</a>
    </div>
  </div>
</header>
