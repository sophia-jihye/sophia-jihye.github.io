<section class="experience" id="experience">
  <div class="section-intro">
    <p class="eyebrow">Experience</p>
    <h2>Each stage added a layer.</h2>
  </div>

  <div class="experience-list">
    {% for item in site.data.experience %}
    <article class="experience-item{% if forloop.first %} experience-current{% endif %}" itemscope itemtype="https://schema.org/Organization">
      <div class="experience-meta">
        <p class="experience-period">{{ item.period }}</p>
        <p class="experience-company" itemprop="name">{{ item.company }}</p>
      </div>
      <div class="experience-copy">
        <h3>{{ item.role }}</h3>
        <p>{{ item.summary }}</p>
        {% if item.bullets %}
        <ul>
          {% for bullet in item.bullets %}<li>{{ bullet }}</li>{% endfor %}
        </ul>
        {% endif %}
      </div>
    </article>
    {% endfor %}
  </div>
</section>
